name: Sync client app from private repo

on:
schedule:
  - cron: "17 * * * *"
workflow_dispatch: {}

permissions:
contents: write

jobs:
sync:
  runs-on: ubuntu-latest
  steps:
    - name: Checkout public repo
      uses: actions/checkout@v4

    - name: Clone private source
      env:
        TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
      run: |
        git clone --depth 1 \
          "https://x-access-token:${TOKEN}@github.com/nlukowsky-dk/NFLProjDK.git" src

    - name: Assemble client subset
      run: |
        rm -rf assets client_app.py dk_view.py sheets.py team_meta.py \
               requirements.txt .streamlit
        mkdir -p assets/logos .streamlit
        cp src/client_app.py src/dk_view.py src/sheets.py src/team_meta.py .
        cp -r src/assets/logos/. assets/logos/
        cp src/.streamlit/config.toml .streamlit/config.toml
        cp src/client_requirements.txt requirements.txt
        rm -rf src

    - name: Commit & push if changed
      run: |
        git config user.name "client-sync-bot"
        git config user.email "client-sync-bot@users.noreply.github.com"
        git add -A
        if git diff --cached --quiet; then
          echo "No changes to sync."
        else
          git commit -m "Sync client app from private repo"
          git push
        fi
